name: ai-server

on:
  push:
    branches: [main, ai_server_2]
    paths:
      - "ai-server/**"
      - ".github/workflows/ai-server.yml"
  pull_request:
    paths:
      - "ai-server/**"
      - ".github/workflows/ai-server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-server/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py test ai
        env:
          AI_MOCK: "true"

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ai-server" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: ghcr login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build (push on main)
        uses: docker/build-push-action@v6
        with:
          context: ai-server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
