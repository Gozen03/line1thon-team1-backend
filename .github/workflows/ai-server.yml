# AI 서버 CI/CD AI 서버 배포 notion 참고해 완성.
# - 모든 push·PR: 테스트
# - main에 push: 이미지 빌드 → ghcr.io/<OWNER>/ai-server:latest 로 올리기
#                → (Secrets가 있으면) EC2에서 docker compose pull ai && up -d ai

name: ai-server

on:
    push:
        branches: [main, ai]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: pip
            - run: pip install -r requirements.txt
            - run: python manage.py test ai
              env:
                  AI_MOCK: 'true'

    docker:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: 이미지 이름 정하기 (ghcr은 소문자만)
              run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ai-server" >> "$GITHUB_ENV"
            - uses: docker/setup-buildx-action@v3
            - name: ghcr 로그인
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: 빌드 (main이면 올리기까지)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
                  tags: |
                      ${{ env.IMAGE }}:latest
                      ${{ env.IMAGE }}:${{ github.sha }}

    deploy:
        # 고재민 님이 레포 Secrets에 EC2_HOST, EC2_USER, EC2_SSH_KEY를 넣으면 동작
        # (선택) EC2_COMPOSE_DIR: docker-compose.yml이 있는 폴더, 없으면 ~/app
        needs: docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        env:
            HAS_EC2: ${{ secrets.EC2_HOST != '' }}
        steps:
            - name: Secrets가 없으면 건너뜀
              if: env.HAS_EC2 != 'true'
              run: echo "EC2 Secrets가 없어서 EC2 반영은 건너뜁니다 (이미지는 올라갔어요)."
            - name: EC2에서 AI 컨테이너 새 이미지로 교체
              if: env.HAS_EC2 == 'true'
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      cd ${{ secrets.EC2_COMPOSE_DIR || '~/app' }}
                      docker compose pull ai
                      docker compose up -d ai
                      sleep 5
                      docker compose ps ai
