# EC2 ~/app 에서 실행한다. 값은 같은 폴더의 .env.main에서 읽는다.
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - main
    restart: always
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  main:
    image: ghcr.io/gozen03/main-server:latest
    env_file: .env.main
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    expose:
      - "8080"
    # 시작 순서만 맞춘다. AI 서버가 죽어 있어도 메인 서버는 뜨고, AI가 필요한 API만 AI_SERVER_ERROR를 준다
    depends_on:
      - ai
    restart: always
    logging: *logging

  # AI 서버 (ai-server/). 외부에 열지 않고 main만 http://ai:8000 으로 부른다
  ai:
    image: ghcr.io/gozen03/ai-server:latest
    env_file: .env.ai
    expose:
      - "8000"
    restart: always
    logging: *logging
