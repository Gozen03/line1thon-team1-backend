# EC2 ~/app 에서 실행한다. 값은 같은 폴더의 .env.main에서 읽는다.
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - main
    restart: always
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  main:
    image: ghcr.io/gozen03/main-server:latest
    env_file: .env.main
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    expose:
      - "8080"
    # depends_on: [ai]   # AI 서버를 올릴 때 푼다
    restart: always
    logging: *logging

