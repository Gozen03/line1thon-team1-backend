# 인증서를 받은 뒤 conf.d/default.conf를 이 파일로 바꾼다
server {
    listen 80;
    server_name _;

    # 인증서 갱신 확인용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.30nezog.shop$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.30nezog.shop;

    ssl_certificate /etc/letsencrypt/live/api.30nezog.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.30nezog.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # main을 다시 띄우면 IP가 바뀔 수 있어, 시작할 때 한 번만 찾지 않고 Docker DNS로 다시 찾는다
    resolver 127.0.0.11 valid=10s;
    set $main_upstream http://main:8080;

    location / {
        proxy_pass $main_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
        client_max_body_size 55m;  # 앱의 max-request-size와 같게 (사진 5장 + 텍스트)
    }
}
