# HTTP 단계. 인증서를 받은 뒤에는 ../default-https.conf로 바꾼다
server {
    listen 80;
    server_name _;

    # main을 다시 띄우면 IP가 바뀔 수 있어, 시작할 때 한 번만 찾지 않고 Docker DNS로 다시 찾는다
    resolver 127.0.0.11 valid=10s;
    set $main_upstream http://main:8080;

    # 인증서 발급·갱신 확인용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass $main_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
        client_max_body_size 55m;  # 앱의 max-request-size와 같게 (사진 5장 + 텍스트)
    }
}
