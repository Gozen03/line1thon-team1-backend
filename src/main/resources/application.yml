# 이 파일은 깃에 올린다. 비밀값은 ${...}로만 적고, 실제 값은 .env(로컬) / .env.main(EC2)에 둔다.
spring:
  application:
    name: jisik-namu-main
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    # 로그인은 JWT로 직접 처리하므로 기본 계정(로그에 찍히는 generated password)을 만들지 않는다
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 테이블은 db/schema.sql로 만든다. JPA는 맞는지만 검사
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 10MB      # 사진 1장 10MB
      max-request-size: 55MB   # 최대 5장 + 텍스트

server:
  port: 8080
  forward-headers-strategy: native   # nginx가 넘기는 X-Forwarded-*로 원래 주소·HTTPS 여부를 안다

jwt:
  secret: ${JWT_SECRET}
  expiration-days: 30

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8000}
    timeout-seconds: 50
    internal-key: ${AI_INTERNAL_KEY}

aws:
  access-key: ${AWS_ACCESS_KEY:}
  secret-key: ${AWS_SECRET_KEY:}
  region: ${AWS_REGION:ap-northeast-2}

s3:
  bucket: ${S3_BUCKET:}
  presigned-url-minutes: 10

review:
  delay-days: 3         # 시연은 0
  retry-delay-days: 1   # 시연은 0
