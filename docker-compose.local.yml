# 로컬 개발용 MySQL (노트북 MySQL이 3306을 쓰므로 3307로 연다)
# 실행: docker compose -f docker-compose.local.yml up -d
# 값은 같은 폴더의 .env에서 읽는다.
services:
  mysql:
    image: mysql:8.4
    container_name: jisik-namu-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: jisik_namu
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      # 컨테이너를 처음 만들 때 한 번만 실행된다
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql-data:
